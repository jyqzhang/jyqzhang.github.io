<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Butterflies · Three layout studies</title><link rel="stylesheet" href="styles.css"><body><header><a href="/playground/?v=57">← Playground</a><nav><button data-mode="a" aria-pressed="true">01 · Scattered gallery</button><button data-mode="b" aria-pressed="false">02 · Collected collage</button><button data-mode="c" aria-pressed="false">03 · Editorial grid</button></nav></header><main class="a"><div class="heading"><h1>Butterflies</h1><p>Layout studies / Julia Zhang</p></div><div id="gallery"></div></main><dialog><button class="close" aria-label="Close enlarged image">Close ×</button><img alt=""></dialog><script src="/assets-data.js?v=57"></script><script>const items=playgroundCollections.find(g=>g.title==='butterflies').items;const gallery=document.querySelector('#gallery');gallery.innerHTML=items.map((a,i)=>`<figure><span>(${String(i+1).padStart(2,'0')})</span><button class="photo" data-src="${a.src}" aria-label="Enlarge butterfly artwork ${i+1}"><img src="${a.thumb||a.src}" width="${a.width}" height="${a.height}" alt="Butterfly artwork ${i+1}"></button></figure>`).join('');const main=document.querySelector('main');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{main.className=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));history.replaceState(null,'','#'+b.dataset.mode)});if(['a','b','c'].includes(location.hash.slice(1)))document.querySelector('[data-mode='+location.hash.slice(1)+']').click();const dialog=document.querySelector('dialog');document.querySelectorAll('.photo').forEach(b=>b.onclick=()=>{dialog.querySelector('img').src=b.dataset.src;dialog.showModal()});document.querySelector('.close').onclick=()=>dialog.close();</script></body></html>
